<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Card verification failed</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #991b1b; background: #fef2f2; text-align: center; }
    </style>
</head>
<body>
    <div>
        <h2>✗ Card verification failed / אימות הכרטיס נכשל</h2>
        <p>Please go back and try again. / חזור ונסה שוב.</p>
    </div>
    <script>
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'gambot-sim-card', status: 'failure' }, window.location.origin);
        }
    </script>
</body>
</html>
